<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>…</title>
<style>
  :root { --cream:#f3ecdc; --red:#8c1c24; --deep:#2b0a0e; --ink:#150507; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--deep); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* ---------- СТРАНИЦА ПОД ОКНОМ: красная плитка + светлые диагональные блики как на фото ---------- */
  #site { position: fixed; inset: 0; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #b02a33 0%, #7a141c 48%, #2b0a0e 100%); }
  #site::before { content: ""; position: absolute; inset: -20%;
    background: repeating-linear-gradient(115deg, rgba(255,240,220,.07) 0 140px, rgba(255,240,220,0) 140px 360px);
    animation: streaks 30s linear infinite; }
  @keyframes streaks { to { transform: translateX(360px); } }
  #snake span { position: absolute; left: 0; top: 0; font-weight: 900; line-height: 1;
    will-change: transform; white-space: pre; text-transform: uppercase; }

  /* ---------- ОКНО С КОЛЛАЖЕМ ---------- */
  #popup { position: fixed; inset: 2vh 2vw; z-index: 10; background: var(--ink); border-radius: 10px;
    border: 1px solid rgba(243,236,220,.18);
    box-shadow: 0 30px 80px rgba(0,0,0,.7); display: flex; flex-direction: column; overflow: hidden;
    transform-origin: 50% 100%; }
  #popup.shake { animation: shake .09s linear infinite; }
  #popup.fall { animation: fall 1.2s cubic-bezier(.5,0,.9,.4) forwards; }
  @keyframes shake { 0%{transform:translate(0,0)} 25%{transform:translate(-5px,3px) rotate(-.3deg)} 50%{transform:translate(4px,-3px)} 75%{transform:translate(-3px,-4px) rotate(.3deg)} 100%{transform:translate(0,0)} }
  @keyframes fall { 0%{transform:translateY(0) rotate(0)} 100%{transform:translateY(130vh) rotate(14deg)} }

  #titlebar { height: 34px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: rgba(243,236,220,.7); font-size: 13px; }
  #titlebar i { width: 11px; height: 11px; border-radius: 50%; background: rgba(243,236,220,.3); display: inline-block; }
  #timer { margin-left: auto; font-variant-numeric: tabular-nums; }
  #progress { height: 3px; background: linear-gradient(90deg, #b02a33, #f3ecdc); width: 100%; transform-origin: left; flex: none; }

  /* фото целиком, без обрезки (все кадры 2:3), размер подбирает скрипт */
  #collage { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
    gap: 16px; padding: 16px; overflow: hidden; }
  .tile { flex: none; width: var(--w, 200px); height: var(--h, 300px); border-radius: 3px;
    outline: 5px solid var(--cream); box-shadow: 0 10px 28px rgba(0,0,0,.55);
    rotate: var(--r, 0deg); animation: float 6s ease-in-out infinite alternate; }
  .tile:nth-child(1) { --r: -2deg; }  .tile:nth-child(2) { --r: 1.4deg; animation-delay: -1.5s; }
  .tile:nth-child(3) { --r: -.8deg; animation-delay: -3s; } .tile:nth-child(4) { --r: 2deg; animation-delay: -4.5s; }
  .tile:nth-child(5) { --r: -1.5deg; animation-delay: -2s; }
  .tile img { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 3px; }
  @keyframes float { from { translate: 0 -5px; } to { translate: 0 5px; } }

  /* ---------- УБЕГАЮЩИЙ КРЕСТИК ---------- */
  #x { position: fixed; z-index: 20; width: 46px; height: 46px; right: 10px; top: 42%;
    border: 2px solid var(--ink); border-radius: 50%; background: var(--cream); color: #7a141c; font-size: 30px; line-height: 40px; text-align: center;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.6); transition: left .18s ease-out, top .18s ease-out; user-select: none; }
  #x.gone { display: none; }
  #taunt { position: fixed; z-index: 21; pointer-events: none; color: var(--cream); background: rgba(21,5,7,.85); padding: 4px 9px; border-radius: 12px; font-size: 13px; opacity: 0; transition: opacity .2s; }
</style>
</head>

<button id="x" aria-label="Закрыть">×</button>
<div id="taunt"></div>

<script>
(() => {
  const DURATION = 60;                       // секунд до «провала»
  const TEST = location.hash === '#skip';    // добавь #skip к адресу, чтобы проверить за 5 секунд
  const total = TEST ? 5 : DURATION;

  const x = document.getElementById('x');
  const taunt = document.getElementById('taunt');
  const popup = document.getElementById('popup');
  const progress = document.getElementById('progress');
  const timerEl = document.getElementById('timer');


  /* ---------- подбор размера фото: всё помещается, ничего не обрезается ---------- */
  const collage = document.getElementById('collage');
  function fit() {
    const g = 16, p = 16, pad = 24;                       // зазор, поля, запас на рамку и наклон
    const aw = collage.clientWidth - 2 * p - pad, ah = collage.clientHeight - 2 * p - pad;
    let best = { h: 0, cols: 5 };
    for (let r = 1; r <= 5; r++) {
      const cols = Math.ceil(5 / r);
      const h = Math.min((ah - (r - 1) * g) / r, ((aw - (cols - 1) * g) / cols) * 1.5);
      if (h > best.h) best = { h, cols };
    }
    const h = Math.max(60, Math.floor(best.h)), w = Math.floor(h * 2 / 3);
    collage.style.setProperty('--h', h + 'px');
    collage.style.setProperty('--w', w + 'px');
    const contentW = best.cols * w + (best.cols - 1) * g + 2;
    const side = Math.max(p, Math.floor((collage.clientWidth - contentW) / 2));
    collage.style.paddingLeft = collage.style.paddingRight = side + 'px';
  }
  fit();
  addEventListener('resize', fit);

  /* ---------- убегающий крестик ---------- */
  const phrases = ['не тут 😏', 'мимо!', 'сиди смотри', 'ага, щас', 'ещё чуть-чуть', 'неть', 'поймай попробуй', 'ну куда ты'];
  let closed = false, tauntT;
  function jump() {
    if (closed) return;
    const m = 8, s = 46;
    const W = innerWidth, H = innerHeight;
    let nx, ny, tries = 0;
    do {
      // чаще прыгает к краям, как «боковой» крестик
      const side = Math.random();
      nx = side < .5 ? (Math.random() < .5 ? m : W - s - m) : m + Math.random() * (W - s - 2*m);
      ny = m + Math.random() * (H - s - 2*m);
      tries++;
    } while (tries < 20 && Math.hypot(nx - x.offsetLeft, ny - x.offsetTop) < 160);
    x.style.right = 'auto';
    x.style.left = nx + 'px';
    x.style.top = ny + 'px';
    showTaunt(nx, ny);
  }
  function showTaunt(nx, ny) {
    taunt.textContent = phrases[Math.floor(Math.random() * phrases.length)];
    taunt.style.left = Math.min(nx, innerWidth - 150) + 'px';
    taunt.style.top = Math.max(ny - 30, 4) + 'px';
    taunt.style.opacity = 1;
    clearTimeout(tauntT);
    tauntT = setTimeout(() => taunt.style.opacity = 0, 700);
  }
  // убегает ещё до наведения, как только курсор приближается
  addEventListener('pointermove', e => {
    if (closed) return;
    const r = x.getBoundingClientRect();
    const d = Math.hypot(e.clientX - (r.left + r.width/2), e.clientY - (r.top + r.height/2));
    if (d < 90) jump();
  });
  ['mouseenter', 'pointerdown', 'touchstart', 'focus'].forEach(ev =>
    x.addEventListener(ev, e => { e.preventDefault(); jump(); }, { passive: false }));
  x.addEventListener('click', e => { e.preventDefault(); jump(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); jump(); } });
  addEventListener('contextmenu', e => { if (!closed) e.preventDefault(); });

  /* ---------- таймер ---------- */
  const t0 = performance.now();
  function tick(now) {
    const left = Math.max(0, total - (now - t0) / 1000);
    timerEl.textContent = Math.ceil(left);
    progress.style.transform = 'scaleX(' + (left / total) + ')';
    if (left > 0) requestAnimationFrame(tick); else dropThrough();
  }
  requestAnimationFrame(tick);

  function dropThrough() {
    closed = true;
    taunt.style.opacity = 0;
    x.classList.add('gone');
    startSnake();
    popup.classList.add('shake');
    setTimeout(() => {
      popup.classList.remove('shake');
      popup.classList.add('fall');
      setTimeout(() => popup.remove(), 1300);
    }, 900);
  }

  /* ---------- змейка из букв ---------- */
  const TEXT = 'Я САМАЯ ПИЗДАТАЯ';
  const snake = document.getElementById('snake');
  let spans = [], started = false;

  function startSnake() {
    if (started) return; started = true;
    [...TEXT].forEach(ch => {
      const s = document.createElement('span');
      s.textContent = ch;
      snake.appendChild(s);
      spans.push(s);
    });
    sizeUp();
    addEventListener('resize', sizeUp);
    requestAnimationFrame(loop);
  }

  let fs = 60, spacing = 50;
  function sizeUp() {
    fs = Math.max(34, Math.min(innerWidth, innerHeight) * 0.11);
    spacing = fs * 0.8;
    spans.forEach(s => s.style.fontSize = fs + 'px');
  }

  // бегущая строка-змейка: буквы едут справа налево, волнами, уходят за край и выходят с другой стороны
  const SPEED = 55;            // пикселей в секунду (меньше — медленнее)
  const WAVE_SPEED = 0.9;      // скорость волны (рад/с)
  let t0s = null;
  function loop(now) {
    if (t0s === null) t0s = now;
    const t = (now - t0s) / 1000;
    const W = innerWidth, H = innerHeight;
    const n = spans.length;
    const loopLen = Math.max(n * spacing + W * 0.25, W + fs * 3);   // длина «петли» (больше экрана — выход незаметен)
    const lambda = Math.max(W * 0.9, 700);                          // длина волны змейки
    const amp = Math.max(H * 0.22, fs);                              // размах по вертикали
    const k = 2 * Math.PI / lambda;

    spans.forEach((s, i) => {
      if (TEXT[i] === ' ') { s.style.display = 'none'; return; }
      let x = ((i * spacing - SPEED * t) % loopLen + loopLen) % loopLen - fs * 1.5;
      const ph = k * x - WAVE_SPEED * t;
      const y = H / 2 + amp * Math.sin(ph) - fs / 2;
      const ang = Math.atan(amp * k * Math.cos(ph));
      // перелив в палитре фото: красный → янтарь → кремовый блик, бежит по буквам
      const wv = 0.5 + 0.5 * Math.sin(now / 600 - i * 0.55);
      const hue = 4 + 34 * wv, light = 58 + 30 * wv;
      s.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + ang + 'rad)';
      s.style.color = 'hsl(' + hue + ' 95% ' + light + '%)';
      s.style.textShadow = '0 0 10px rgba(255,120,90,.5), 0 0 28px rgba(255,60,50,.3), 0 3px 0 rgba(30,5,8,.55)';
    });
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
